# CodeRabbit settings for FoundryVTT-Private-Github-proxy.
# Shared rules come from the central dxcufgb/coderabbit repository (inheritance: true), and CodeRabbit reads
# CLAUDE.md (and its Review focus) as code guidelines. Only what is specific to this repository is here.
# Check the merged result on a pull request with: @coderabbitai configuration
inheritance: true

reviews:
  path_instructions:
    - path: "src/server.js"
      instructions: |
        The GitHub token goes only to api.github.com and asset URLs from GitHub's JSON; the pre-signed redirect is
        fetched without auth; the token never appears in a response, a log line or an e-mail. Requests are 2-3
        decoded path segments, module ids looked up with Object.hasOwn on a null-prototype map, tags
        encodeURIComponent'd. Rewritten links use PUBLIC_BASE_URL, never the Host header. Every response is
        Cache-Control: no-store. A repo the token cannot see stays a 404, not a 502. Never default the listener
        to 0.0.0.0. Behaviour changes need a test and a README update.
    - path: "src/zippatch.js"
      instructions: |
        Streams the zip: never unpacks it or holds it in memory (only the end records and module.json, with size
        caps). Anything unexpected before the first byte falls back to the 302; a failure after it must tear the
        connection down rather than send a truncated zip that looks whole. Refuse ZIP64, multi-disk, encrypted or
        odd-method archives.
    - path: "src/admin*.js"
      instructions: |
        Every API call but login needs the session cookie; changes also need X-CSRF-Token and JSON content type;
        unknown Host/Origin is 403; login lockout after 5 failures; X-Forwarded-* only from ADMIN_TRUST_PROXY
        peers; the admin port never serves module routes; no HSTS. A new token must match TOKEN_RE before it is
        written to env. The token API never answers 401. "Update proxy now" may only request the root/SYSTEM run.
    - path: "src/admin-ui/**"
      instructions: |
        Strict CSP: no inline script or style, and the UI only sets text with textContent. Flag innerHTML.
    - path: "src/updater.js"
      instructions: |
        Token optional, only to api.github.com; downloads must match SHA256SUMS.txt; exit codes 0/10/1; only
        strictly newer, non-draft, non-prerelease versions install. No npm dependencies, no APIs newer than Node 20.
