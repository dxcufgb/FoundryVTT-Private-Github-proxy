# Runs on every push and pull request, and as the "ci" job of release.yml (workflow_call) before anything is published:
#   - the unit tests (node --test) on every supported Node version
#   - a syntax check of the server entry point and the updater
#   - shellcheck on the Linux scripts
#   - PSScriptAnalyzer and a parse check on the Windows PowerShell scripts
#   - a real run of install.sh on the Ubuntu runner (systemd) and of the Inno Setup installer on the Windows runner
# The proxy has no npm dependencies, so there is nothing to install.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when release.yml calls this file, so a release's CI run and a push's CI run on
# the same ref never cancel each other
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the event's commit, not a ref that can move during the run (a release's tag)
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Entry points parse
        run: |
          for f in src/*.js src/admin-ui/app.js; do node --check "$f"; done

      - name: Unit tests
        run: npm test

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the event's commit, not a ref that can move during the run (a release's tag)
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Shellcheck the scripts
        run: shellcheck install.sh scripts/*.sh

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the event's commit, not a ref that can move during the run (a release's tag)
          ref: ${{ github.sha }}
          persist-credentials: false

      # PSScriptAnalyzer ships with the runner image; the scripts themselves target Windows PowerShell 5.1.
      - name: Analyze the Windows scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts/*.ps1, packaging/windows/*.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Output "::error file=$($file.Name)::$_" }; $failed = $true }
          }
          $results = 'scripts', 'packaging' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Warning, Error }
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($results -or $failed) { exit 1 }

  linux-install:
    name: install.sh (systemd)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Fake token: the proxy only has to start and answer 404 for a module that is not configured.
      FOUNDRY_PROXY_GITHUB_TOKEN: github_pat_ci_not_a_real_token
      # Not a secret: a throwaway password for the admin page of this test install.
      FOUNDRY_PROXY_ADMIN_PASSWORD: ci-admin-password
      # serve the admin page on its own HTTPS port (8788), like Webmin
      FOUNDRY_PROXY_ADMIN_WEB: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the event's commit, not a ref that can move during the run (a release's tag)
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install with the system Node.js
        run: sudo --preserve-env=FOUNDRY_PROXY_GITHUB_TOKEN,FOUNDRY_PROXY_ADMIN_PASSWORD,FOUNDRY_PROXY_ADMIN_WEB ./install.sh --module demo=octo/demo

      - name: Proxy answers
        run: |
          code=000
          for _ in $(seq 1 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/not-a-module/module.json || true)"
            [ "$code" = 404 ] && break
            sleep 1
          done
          systemctl is-active foundry-release-proxy
          sudo grep -q '"demo"' /etc/foundry-release-proxy/config.json
          test "$(sudo stat -c '%a %U' /etc/foundry-release-proxy/env)" = "600 foundry-proxy"
          test "$(sudo stat -c '%a %U' /etc/foundry-release-proxy/admin.json)" = "600 foundry-proxy"
          test "$(sudo stat -c '%a %U' /etc/foundry-release-proxy/config.json)" = "600 foundry-proxy"
          test "$code" = 404

      - name: Admin page saves modules under the systemd hardening
        run: |
          api=http://localhost:8787/_admin/api
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/_admin/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/state")" = 401
          csrf="$(curl -sf -c "$RUNNER_TEMP/jar" -H 'Content-Type: application/json' \
            -d "{\"password\":\"$FOUNDRY_PROXY_ADMIN_PASSWORD\"}" "$api/login" | jq -r .csrf)"
          test -n "$csrf"
          curl -sf -b "$RUNNER_TEMP/jar" -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" \
            -d '{"id":"added","repo":"octo/added"}' "$api/modules" | jq -e '.modules[] | select(.id == "added")'
          sudo grep -q '"added"' /etc/foundry-release-proxy/config.json
          # the change survives a restart
          sudo systemctl restart foundry-release-proxy
          for _ in $(seq 1 15); do
            sudo journalctl -u foundry-release-proxy --no-pager | grep -q 'modules: demo, added' && exit 0
            sleep 1
          done
          exit 1

      - name: Admin port serves HTTPS with its self-signed certificate
        run: |
          test "$(sudo stat -c '%a %U %G' /etc/foundry-release-proxy/admin-tls.key)" = "640 root foundry-proxy"
          sudo grep -q '^ADMIN_PORT=8788$' /etc/foundry-release-proxy/env
          code=000
          for _ in $(seq 1 15); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8788/_admin/ || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          test "$code" = 200
          # the certificate is the installed one, and plain http on that port is sent to https
          sudo openssl x509 -noout -in /etc/foundry-release-proxy/admin-tls.crt -checkhost localhost | grep -q 'does match'
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8788/x)" = https://localhost:8788/_admin/
          # reachable through this machine's own address too, and the module routes are not on that port
          ip="$(hostname -I | awk '{print $1}')"
          test "$(curl -sk -o /dev/null -w '%{http_code}' "https://$ip:8788/_admin/")" = 200
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8788/demo/module.json)" = 404

      - name: --no-admin-web and --admin-web
        run: |
          sudo ./install.sh --no-admin-web
          sleep 2
          if curl -sk -o /dev/null https://localhost:8788/; then echo "admin port still open"; exit 1; fi
          sudo ./install.sh --admin-web
          code=000
          for _ in $(seq 1 15); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8788/_admin/ || true)"
            [ "$code" = 200 ] && break
            sleep 1
          done
          test "$code" = 200

      - name: Uninstall
        run: |
          sudo ./install.sh --uninstall
          test ! -e /opt/foundry-release-proxy
          test ! -e /etc/systemd/system/foundry-release-proxy.service

      - name: Install again with a downloaded Node.js
        env:
          NODE_BIN: /nonexistent/node
        run: sudo --preserve-env=FOUNDRY_PROXY_GITHUB_TOKEN,NODE_BIN ./install.sh --install-node --module demo=octo/demo

      - name: Proxy answers with the downloaded Node.js
        run: |
          code=000
          for _ in $(seq 1 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/not-a-module/module.json || true)"
            [ "$code" = 404 ] && break
            sleep 1
          done
          grep -q 'ExecStart=/opt/foundry-release-proxy-node/bin/node ' /etc/systemd/system/foundry-release-proxy.service
          test "$code" = 404

  windows-installer:
    name: Inno Setup installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the event's commit, not a ref that can move during the run (a release's tag)
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Inno Setup (if the runner image lacks it)
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: powershell
        run: .\packaging\windows\build-installer.ps1 -OutDir dist

      - name: Install, check and uninstall it
        shell: powershell
        run: .\packaging\windows\smoke-test.ps1 -Installer (Get-ChildItem dist\*.exe).FullName
