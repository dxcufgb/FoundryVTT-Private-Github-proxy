# Runs on every push and pull request:
#   - the unit tests (node --test) on every supported Node version
#   - a syntax check of the server entry point and the updater
#   - shellcheck on the Linux scripts
#   - PSScriptAnalyzer and a parse check on the Windows PowerShell scripts
# The proxy has no npm dependencies, so there is nothing to install.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Entry points parse
        run: |
          node --check src/server.js
          node --check src/updater.js

      - name: Unit tests
        run: npm test

  shell:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck the scripts
        run: shellcheck scripts/*.sh

  powershell:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PSScriptAnalyzer ships with the runner image; the scripts themselves target Windows PowerShell 5.1.
      - name: Analyze the Windows scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Output "::error file=$($file.Name)::$_" }; $failed = $true }
          }
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning, Error
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($results -or $failed) { exit 1 }
