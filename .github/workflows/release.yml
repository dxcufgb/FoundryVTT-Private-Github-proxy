# Publishes a GitHub release, started either way:
#   - push a version tag (v1.2.3) that equals "v" + the version in package.json, or
#   - Actions -> Release -> Run workflow on main: releases the package.json version of main's head as v<version>
#     (refused if that tag already exists); the tag is created on that commit when the release is published
# Then:
#   1. the unit tests must pass
#   2. scripts/build-release.sh builds foundry-release-proxy-<version>.tar.gz (Linux), .zip (Windows), the same two under
#      fixed names (foundry-release-proxy-linux.tar.gz, foundry-release-proxy-windows.zip) and SHA256SUMS; they go into a
#      DRAFT release (the auto-updater ignores drafts) whose notes start with per-OS download links
#      (scripts/release-notes.sh) followed by GitHub's generated notes
#   3. a Windows runner builds FoundryReleaseProxy-Setup-<version>.exe (Inno Setup), installs and uninstalls it as a
#      smoke test, and adds it, a copy named FoundryReleaseProxy-Setup.exe and their .sha256 files to the draft
#   4. only then the draft is published, so a failed installer build never leaves a half release behind
# The fixed names make https://github.com/<repo>/releases/latest/download/<name> a stable link per OS.
# Release steps are in the README ("Releases").

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build archives
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its assets
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Release version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$REF" != "refs/heads/main" ]]; then
              echo "::error::run the release workflow on main (got $REF)"
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
              echo "::error::tag v$version already exists; bump the version in package.json first"
              exit 1
            fi
          elif [[ "$REF_NAME" != "v$version" ]]; then
            echo "::error::tag $REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/updater.js

      - name: Unit tests
        run: npm test

      - name: Build archives
        run: ./scripts/build-release.sh dist

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-notes.sh "$VERSION" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # a pushed tag must exist; a manual run creates the tag on this commit when the draft is published
          if [[ "$EVENT" == "workflow_dispatch" ]]; then tag_opt=(--target "$GITHUB_SHA"); else tag_opt=(--verify-tag); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${tag_opt[@]}" --draft

  installer:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # add the installer to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inno Setup (if the runner image lacks it)
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: powershell
        run: .\packaging\windows\build-installer.ps1 -OutDir dist

      - name: Install, check and uninstall it
        shell: powershell
        run: .\packaging\windows\smoke-test.ps1 -Installer (Get-ChildItem dist\*.exe).FullName

      - name: Add it to the draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # a copy under a fixed name for .../releases/latest/download/FoundryReleaseProxy-Setup.exe
          $exe = (Get-ChildItem dist\FoundryReleaseProxy-Setup-*.exe).FullName
          $latest = Join-Path (Split-Path $exe) 'FoundryReleaseProxy-Setup.exe'
          Copy-Item -LiteralPath $exe -Destination $latest
          $hash = (Get-FileHash -LiteralPath $latest -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$latest.sha256", "$hash  FoundryReleaseProxy-Setup.exe`n", (New-Object System.Text.UTF8Encoding $false))
          $files = $exe, "$exe.sha256", $latest, "$latest.sha256"
          gh release upload $env:TAG @files --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish:
    name: Publish release
    needs: [build, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # publish the draft
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
