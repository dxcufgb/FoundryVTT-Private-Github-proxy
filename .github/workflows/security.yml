# Security scans. GitHub's own secret scanning and CodeQL are not available for this private repository, so this
# workflow runs free tools instead. Identical in every dxcufgb repository except the Dependencies job (per language).
# The three job names "Secrets (gitleaks)", "Code (Semgrep)" and "Dependencies" are required status checks: keep them.
#   - Secrets (gitleaks): the whole history of the checked-out commit, with a pinned gitleaks release binary whose
#     SHA-256 is hard-coded below. Output is redacted. A true false positive (a fake token in a test) goes into
#     .gitleaks.toml (extends the default rules) as a narrow allowlist entry with a comment.
#   - Code (Semgrep): the Semgrep registry rulesets listed in the scan step, rules of severity WARNING and ERROR.
#     INFO rules are style and best-practice hints, too noisy for a blocking check. Fix a finding, or mark a false
#     positive with an inline "nosemgrep: <rule-id>" comment and a reason; .semgrepignore is only for vendored or
#     generated files.
#   - Dependencies: known vulnerabilities in the pinned dependencies (see the job).
# Findings show up as annotations on the pull request. The weekly run catches new advisories and new rules for code
# that has not changed. How to run the three checks locally: README, Development.
# Updating a tool: change its version below; for gitleaks also GITLEAKS_SHA256, the sha256 of
# gitleaks_<version>_linux_x64.tar.gz from that release's gitleaks_<version>_checksums.txt.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:23 UTC
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.180.0"

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history, not just the last commit
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $dir/$archive" | sha256sum --check --strict -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan the git history
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          # .gitleaks.toml in the repository root is picked up automatically when present
          if gitleaks git --redact --no-banner --exit-code 1 --report-format json --report-path "$report" .; then
            exit 0
          fi
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks \(.RuleID)::Possible secret (\(.RuleID)) in commit \(.Commit[0:12]); remove and rotate it, or allowlist a false positive in .gitleaks.toml"' "$report" || true
          exit 1

  code:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check --no-cache-dir --quiet "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"

      - name: Scan the code
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          report="$RUNNER_TEMP/semgrep.json"
          status=0
          semgrep scan --metrics=off --disable-version-check --error \
            --severity WARNING --severity ERROR \
            --config p/python --config p/javascript --config p/security-audit \
            --config p/secrets --config p/github-actions --config p/bash \
            --json-output="$report" || status=$?
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line),endLine=\(.end.line),title=\(.check_id)::\(.extra.message | gsub("[\r\n%]"; " "))"' "$report" || true
          exit "$status"

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The proxy has no npm dependencies (Node built-ins only), so there is nothing to audit. This job keeps the
      # required check and fails once package.json declares a dependency: then commit package-lock.json and audit it
      # here with `npm ci --ignore-scripts` and `npm audit --omit=dev --audit-level=low` / `npm audit --audit-level=high`.
      - name: Check that there are no npm dependencies
        run: |
          node -e '
            const pkg = require("./package.json");
            const fields = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies", "bundleDependencies"];
            const found = fields.filter((f) => pkg[f] && Object.keys(pkg[f]).length > 0);
            if (found.length > 0) {
              console.log("::error file=package.json::package.json declares " + found.join(", ") + "; add package-lock.json and an npm audit to this job");
              process.exit(1);
            }
          '
          echo "No npm dependencies (Node built-ins only): nothing to audit."
